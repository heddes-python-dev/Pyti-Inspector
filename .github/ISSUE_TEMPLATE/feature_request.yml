name: Idee vorschlagen
description: Eine Funktion oder Verbesserung für den Inspector vorschlagen
title: "[Idee]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem oder welcher Bedarf besteht?
      description: Beschreibe, was derzeit schwierig ist oder fehlt.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Vorgeschlagene Lösung
      description: Wie sollte sich der Inspector verhalten?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen oder Beispiele
